<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Forensics &amp; Attribution — Investigation Workbench</title>
<meta name="description" content="AI Forensics & Attribution Engine — investigate failures where AI may have been involved. Reconstruct events from evidence, identify the root cause, and determine the role AI actually played." />
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #0c1119;
    --panel: #111823;
    --panel-2: #141c28;
    --line: #202a38;
    --line-soft: #1a2230;
    --ink: #eef2f7;
    --ink-2: #c6d0dc;
    --muted: #7d8a9c;
    --muted-2: #5b6675;

    /* Meaningful accents — used sparingly and consistently */
    --trust: #58b0ff;     /* observed evidence / neutral-trusted */
    --ai: #a371f7;        /* AI influence */
    --origin: #f8604f;    /* failure origin / critical */
    --amber: #e0a53a;     /* contributed / moderate */
    --teal: #3fd0b0;      /* non-AI root cause / resolved */
    --green: #46c96a;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: radial-gradient(1100px 520px at 78% -12%, #12203010 0%, transparent 60%), var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside {
    border-right: 1px solid var(--line-soft);
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    padding: 22px 16px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 26px;
  }
  .brand { display: flex; gap: 11px; align-items: flex-start; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(150deg, var(--ai), var(--trust));
    display: grid; place-items: center; font-weight: 800; color: #0a0e14; font-size: 15px;
  }
  .brand .name { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
  .brand .sub { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }

  nav.side { display: flex; flex-direction: column; gap: 2px; }
  nav.side a {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border-radius: 9px; color: var(--muted);
    font-size: 13.5px; font-weight: 500; transition: background .12s, color .12s;
  }
  nav.side a .ic { width: 15px; text-align: center; opacity: .85; font-size: 13px; }
  nav.side a:hover { color: var(--ink-2); background: #ffffff08; }
  nav.side a.active { color: var(--ink); background: #ffffff10; }
  nav.side a.active .ic { color: var(--trust); opacity: 1; }

  .side-foot { margin-top: auto; font-size: 11px; color: var(--muted-2); line-height: 1.5; }
  .side-foot .demo { display:inline-flex; align-items:center; gap:6px; color: var(--amber); font-weight:600; }
  .side-foot .demo::before { content:""; width:6px; height:6px; border-radius:50%; background: var(--amber); }

  main { padding: 30px 40px 90px; max-width: 1180px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 14px; }
    nav.side { flex-direction: row; flex-wrap: wrap; }
    .side-foot { display: none; }
    main { padding: 22px 18px 70px; }
  }

  /* ---------- Typography / helpers ---------- */
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); font-weight: 600; }
  h1.page { font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -.025em; margin: 12px 0 8px; font-weight: 700; }
  .lead { color: var(--ink-2); font-size: 16px; max-width: 640px; margin: 0; }
  .principle { margin-top: 16px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .principle b { color: var(--trust); font-weight: 700; }
  .muted { color: var(--muted); }
  h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; margin: 44px 0 16px; }

  /* ---------- Story strip ---------- */
  .story { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 26px; }
  .story .s { font-size: 12.5px; color: var(--ink-2); padding: 7px 12px; border-radius: 8px; background: #ffffff06; border: 1px solid var(--line-soft); }
  .story .s b { color: var(--ink); font-weight: 650; }
  .story .a { color: var(--muted-2); font-size: 13px; }

  /* ---------- Metrics ---------- */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 12px; }
  @media (max-width: 760px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  .metric { padding: 20px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line-soft); }
  .metric .n { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-family: var(--mono); }
  .metric .l { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .metric.awaiting .n { color: var(--amber); }
  .metric.active .n { color: var(--trust); }
  .metric.root .n { color: var(--teal); }

  /* ---------- Table ---------- */
  .tablewrap { border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th { text-align: left; padding: 13px 16px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--bg-2); border-bottom: 1px solid var(--line-soft); }
  tbody td { padding: 15px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; transition: background .12s; }
  tbody tr.click:hover { background: #ffffff06; }
  .cell-title { font-weight: 600; color: var(--ink); }
  .cell-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  td.rc { color: var(--ink-2); max-width: 260px; }

  /* ---------- Pills ---------- */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 650; font-family: var(--mono); letter-spacing: .02em; white-space: nowrap; }
  .attr-caused { background: #f8604f18; color: #ff8778; border: 1px solid #f8604f38; }
  .attr-contributed { background: #e0a53a18; color: var(--amber); border: 1px solid #e0a53a38; }
  .attr-involved { background: #a371f718; color: #bd9bfb; border: 1px solid #a371f736; }
  .attr-nonai { background: #3fd0b016; color: var(--teal); border: 1px solid #3fd0b032; }
  .attr-insufficient { background: #ffffff0c; color: var(--muted); border: 1px solid var(--line); }

  .ev { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .ev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
  .ev-strong { color: var(--trust); } .ev-strong::before { background: var(--trust); }
  .ev-moderate { color: var(--amber); } .ev-moderate::before { background: var(--amber); }
  .ev-limited { color: var(--muted); } .ev-limited::before { background: var(--muted); }

  .status { font-size: 12px; font-weight: 600; }
  .st-completed { color: var(--teal); }
  .st-investigating { color: var(--amber); }
  .st-awaiting { color: var(--muted); }

  .demo-tag { display:inline-flex; align-items:center; gap:6px; font-size: 10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color: var(--amber); border:1px solid #e0a53a35; background:#e0a53a12; padding:3px 8px; border-radius:6px; }

  /* ---------- Detail view ---------- */
  .back { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 22px; }
  .back:hover { color: var(--ink-2); }

  .inv-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--line-soft); }
  .inv-head .id { font-family: var(--mono); font-size: 12px; color: var(--trust); letter-spacing: .05em; }
  .inv-head h1 { font-size: clamp(24px, 3vw, 34px); margin: 8px 0 6px; letter-spacing: -.02em; font-weight: 700; }
  .inv-head .who { color: var(--muted); font-size: 14px; }
  .inv-head .meta-r { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .inv-head .time { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }

  .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 26px; }
  @media (max-width: 820px) { .answer-grid { grid-template-columns: 1fr; } }
  .block { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 20px 22px; }
  .block .k { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .block .v { margin-top: 9px; font-size: 15px; color: var(--ink); line-height: 1.5; }

  .rootcause { border: 1px solid #3fd0b028; background: linear-gradient(180deg, #3fd0b00a, transparent); }
  .rootcause .k { color: var(--teal); }
  .rootcause .v { font-size: 17px; font-weight: 600; }

  .attrbox { border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px; margin-top: 18px; background: var(--panel); }
  .attrbox .role-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .attrbox .role { margin: 12px 0 12px; }
  .attrbox .role .pill { font-size: 15px; padding: 8px 16px; }
  .attrbox .why { color: var(--ink-2); font-size: 14.5px; max-width: 720px; }
  .attr-split { display:grid; grid-template-columns: 1fr 1fr; gap:18px; margin-top:18px; }
  @media (max-width: 820px){ .attr-split { grid-template-columns:1fr; } }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; margin-top: 18px; padding-left: 4px; }
  .tl-row { display: grid; grid-template-columns: 88px 1fr; gap: 18px; position: relative; }
  .tl-time { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding-top: 14px; text-align: right; }
  .tl-body { position: relative; padding: 0 0 22px 26px; border-left: 2px solid var(--line); }
  .tl-row:last-child .tl-body { border-left-color: transparent; }
  .tl-dot { position: absolute; left: -8px; top: 15px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); }
  .tl-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 11px; padding: 12px 15px; font-size: 14px; color: var(--ink-2); }
  .tl-card .txt { color: var(--ink); }
  .tl-mark { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; margin-top: 8px; padding: 3px 9px; border-radius: 6px; }

  .tl-ai .tl-dot { border-color: var(--ai); box-shadow: 0 0 0 4px #a371f722; }
  .tl-ai .tl-card { border-color: #a371f740; background: linear-gradient(180deg, #a371f70e, var(--panel)); }
  .tl-ai .tl-mark { color: var(--ai); background: #a371f71a; border: 1px solid #a371f740; }

  .tl-origin .tl-dot { border-color: var(--origin); box-shadow: 0 0 0 4px #f8604f26; width: 16px; height: 16px; left: -9px; }
  .tl-origin .tl-card { border-color: #f8604f4a; background: linear-gradient(180deg, #f8604f12, var(--panel)); }
  .tl-origin .tl-mark { color: #ff8778; background: #f8604f1c; border: 1px solid #f8604f4a; }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 6px 0 4px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* ---------- Evidence list ---------- */
  .ev-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .ev-item { display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 11px; }
  .ev-item .eid { font-family: var(--mono); font-size: 12.5px; color: var(--trust); font-weight: 600; }
  .ev-item .etitle { color: var(--ink); font-size: 14px; }
  .ev-item .emeta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 14px; flex-wrap: wrap; }
  .ev-item .etype { font-size: 11px; color: var(--trust); border: 1px solid #58b0ff30; background: #58b0ff12; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .ev-item:target, .ev-item.flash { border-color: var(--trust); box-shadow: 0 0 0 3px #58b0ff22; }

  /* ---------- Facts vs findings ---------- */
  .fvf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 14px; }
  @media (max-width: 820px) { .fvf { grid-template-columns: 1fr; } }
  .fcol { border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px 18px; background: var(--panel); }
  .fcol h4 { margin: 0 0 4px; font-size: 13px; }
  .fcol .hint { font-size: 11px; color: var(--muted-2); margin-bottom: 12px; }
  .fcol ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .fcol li { font-size: 13.5px; color: var(--ink-2); padding-left: 16px; position: relative; }
  .fcol li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; border-radius: 50%; }
  .fcol.observed h4 { color: var(--trust); } .fcol.observed li::before { background: var(--trust); }
  .fcol.derived h4 { color: var(--ai); } .fcol.derived li::before { background: var(--ai); }
  .fcol.unknown h4 { color: var(--muted); } .fcol.unknown li::before { background: var(--muted); }
  .fcol.unknown li { color: var(--muted); }

  /* ---------- Contributing factors ---------- */
  .factors { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .factor { font-size: 13.5px; color: var(--ink-2); padding: 10px 14px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; border-left: 3px solid var(--amber); }

  /* ---------- Findings ---------- */
  .findings { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .finding { padding: 16px 18px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; }
  .finding .fnum { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .finding .ftext { font-size: 14.5px; color: var(--ink); margin: 6px 0 10px; }
  .finding .fev { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .evref { font-family: var(--mono); font-size: 12px; color: var(--trust); border: 1px solid #58b0ff30; background: #58b0ff10; padding: 2px 8px; border-radius: 6px; cursor: pointer; }
  .evref:hover { background: #58b0ff20; }

  /* ---------- Cards / system view ---------- */
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 14px; }
  @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 20px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .card ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
  .card ul li { margin: 4px 0; }
  code { font-family: var(--mono); background: #0a0f17; border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-size: 12px; color: var(--ink-2); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: var(--muted); }
  .ok { color: var(--teal); } .warn { color: var(--amber); }
  .subnote { font-size: 12px; color: var(--muted-2); margin-top: 10px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark">Æ</div>
      <div>
        <div class="name">AI Forensics<br/>&amp; Attribution</div>
        <div class="sub">Engine</div>
      </div>
    </div>
    <nav class="side" id="nav">
      <a data-view="overview" class="active"><span class="ic">◎</span> Overview</a>
      <a data-view="investigations"><span class="ic">▤</span> Investigations</a>
      <a data-view="evidence"><span class="ic">◈</span> Evidence</a>
      <a data-view="systems"><span class="ic">⬡</span> AI Systems</a>

      <div class="demo">Demo data</div>
      <div style="margin-top:6px">Illustrative cases. The capture &amp; attribution engine is real; these specific investigations are mock records.</div>
    </div>
  </aside>

  <main id="main"><!-- rendered by JS --></main>
</div>

/* ---------- label / class maps ---------- */
const ATTR_LABEL = {
  AI_CAUSED: "AI CAUSED",
  AI_CONTRIBUTED: "AI CONTRIBUTED",
  AI_INVOLVED_NOT_CAUSAL: "AI INVOLVED — NOT CAUSAL",
  NON_AI_ROOT_CAUSE: "NON-AI ROOT CAUSE",
  INSUFFICIENT_EVIDENCE: "INSUFFICIENT EVIDENCE"
};
const ATTR_CLASS = {
  AI_CAUSED: "attr-caused",
  AI_CONTRIBUTED: "attr-contributed",
  AI_INVOLVED_NOT_CAUSAL: "attr-involved",
  NON_AI_ROOT_CAUSE: "attr-nonai",
  INSUFFICIENT_EVIDENCE: "attr-insufficient"
};
const EV_CLASS = { Strong: "ev-strong", Moderate: "ev-moderate", Limited: "ev-limited" };
const ST_CLASS = { Completed: "st-completed", Investigating: "st-investigating", "Awaiting Evidence": "st-awaiting" };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const attrPill = (a) => `<span class="pill ${ATTR_CLASS[a]}">${ATTR_LABEL[a]}</span>`;
const evBadge = (s) => `<span class="ev ${EV_CLASS[s]}">${s}</span>`;
const stBadge = (s) => `<span class="status ${ST_CLASS[s]}">${s}</span>`;

/* ---------- views ---------- */
function metrics() {
  const inv = DATA.investigations;
  return {
    active: inv.filter((i) => i.status === "Investigating").length,
    analyzed: inv.length,
    root: inv.filter((i) => i.status === "Completed").length,
    awaiting: inv.filter((i) => i.attribution === "INSUFFICIENT_EVIDENCE" || i.status === "Awaiting Evidence").length
  };
}

function viewOverview() {
  const m = metrics();
  const rows = DATA.investigations.map(rowFor).join("");
  return `
    <div class="eyebrow">Forensic Investigation Workbench</div>
    <h1 class="page">AI Forensics &amp; Attribution</h1>
    <p class="lead">Understand what failed. Reconstruct what happened. Determine why.</p>
    <p class="principle"><b>Evidence first. Attribution second. No assumptions.</b> Determines cause and AI role; it does not assess business impact.</p>

    <div class="story">
      <span class="s"><b>Something failed</b></span><span class="a">→</span>
      <span class="s">We have <b>evidence</b></span><span class="a">→</span>
      <span class="s">We <b>reconstructed</b> it</span><span class="a">→</span>
      <span class="s">We found the <b>origin</b></span><span class="a">→</span>
      <span class="s"><b>Contributing factors</b></span><span class="a">→</span>
      <span class="s">The <b>role AI played</b></span>
    </div>

    <h2 class="sec">Investigations</h2>
    <div class="metrics">
      <div class="metric active"><div class="n">${m.active}</div><div class="l">Active investigations</div></div>
      <div class="metric"><div class="n">${m.analyzed}</div><div class="l">Failures analyzed</div></div>
      <div class="metric root"><div class="n">${m.root}</div><div class="l">Root cause identified</div></div>
      <div class="metric awaiting"><div class="n">${m.awaiting}</div><div class="l">Awaiting evidence</div></div>
    </div>

    <h2 class="sec" style="display:flex;justify-content:space-between;align-items:center">
      <span>Recent investigations</span> <span class="demo-tag">Demo data</span>
    </h2>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Failure</th><th>Time</th><th>AI system</th><th>Root cause</th><th>AI role</th><th>Evidence</th><th>Status</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function rowFor(i) {
  return `<tr class="click" data-open="${i.id}">
    <td><div class="cell-title">${esc(i.title)}</div><div class="cell-sub">${i.id}</div></td>
    <td class="muted" style="font-size:12.5px;white-space:nowrap">${esc(i.time)}</td>
    <td>${esc(i.system)}</td>
    <td class="rc">${esc(i.rootCause)}</td>
    <td>${attrPill(i.attribution)}</td>
    <td>${evBadge(i.evidenceStrength)}</td>
    <td>${stBadge(i.status)}</td>
  </tr>`;
}

function viewInvestigations() {
  const rows = DATA.investigations.map(rowFor).join("");
  return `
    <div class="eyebrow">Cases</div>
    <h1 class="page" style="font-size:30px">Investigations</h1>
    <p class="lead" style="font-size:15px">Every case reconstructs a failure from evidence and separates the root cause from the role AI played.</p>
    <h2 class="sec" style="display:flex;justify-content:space-between;align-items:center"><span>All investigations</span><span class="demo-tag">Demo data</span></h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Failure</th><th>Time</th><th>AI system</th><th>Root cause</th><th>AI role</th><th>Evidence</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

function viewDetail(id) {
  const i = DATA.investigations.find((x) => x.id === id);
  if (!i) return viewOverview();

  const tl = i.timeline.map((e) => {
    const cls = e.mark === "ai" ? "tl-ai" : e.mark === "origin" ? "tl-origin" : "";
    const mark = e.mark === "ai" ? `<div class="tl-mark">◆ AI Influence</div>`
      : e.mark === "origin" ? `<div class="tl-mark">▲ Failure Origin</div>` : "";
    return `<div class="tl-row ${cls}">
      <div class="tl-time">${esc(e.time)}</div>
      <div class="tl-body"><span class="tl-dot"></span>
        <div class="tl-card"><span class="txt">${esc(e.text)}</span>${mark}</div>
      </div>
    </div>`;
  }).join("");

  const evItems = i.evidence.map((e) => {
    const meta = Object.entries(e.meta).map(([k, v]) => `<span>${esc(k)}: ${esc(v)}</span>`).join("");
    return `<div class="ev-item" id="${e.id}">
      <div class="eid">${e.id}</div>
      <div><div class="etitle">${esc(e.title)}</div><div class="emeta">${meta}</div></div>
      <div class="etype">${esc(e.type)}</div>
    </div>`;
  }).join("");

  const findings = i.findings.map((f, n) => {
    const refs = f.ev.map((r) => `<span class="evref" data-ev="${r}">${r}</span>`).join(" ");
    return `<div class="finding">
      <div class="fnum">Finding ${String(n + 1).padStart(2, "0")}</div>
      <div class="ftext">${esc(f.text)}</div>
      <div class="fev">Evidence: ${refs}</div>
    </div>`;
  }).join("");

  const factors = i.contributing.map((c) => `<div class="factor">${esc(c)}</div>`).join("");
  const li = (arr) => arr.map((x) => `<li>${esc(x)}</li>`).join("");

  return `
    <a class="back" data-view="investigations">← All investigations</a>
    <div class="inv-head">
      <div>
        <div class="id">${i.id}</div>
        <h1>${esc(i.title)}</h1>
        <div class="who">${esc(i.system)} · ${esc(i.app)}</div>
      </div>
      <div class="meta-r">
        ${stBadge(i.status)}
        <div class="time">${esc(i.time)}</div>
        ${evBadge(i.evidenceStrength)} evidence
      </div>
    </div>

    <div class="answer-grid">
      <div class="block"><div class="k">What happened</div><div class="v">${esc(i.whatHappened)}</div></div>
      <div class="block"><div class="k">Failure</div><div class="v">${esc(i.failure)}</div></div>
    </div>

    <h2 class="sec">Root cause &amp; attribution</h2>
    <div class="block rootcause"><div class="k">Root cause</div><div class="v">${esc(i.rootCause)}</div></div>

    <div class="attrbox">
      <div class="role-lbl">AI role</div>
      <div class="role">${attrPill(i.attribution)}</div>
      <div class="why">${esc(i.attributionWhy)}</div>
      <div class="subnote">Root cause and AI attribution are separate conclusions — the origin of a failure is not automatically the AI model.</div>
    </div>

    <h2 class="sec">Reconstruction timeline</h2>
    <div class="legend">
      <span><i style="background:var(--ai)"></i> AI influence</span>
      <span><i style="background:var(--origin)"></i> Failure origin</span>
      <span><i style="background:var(--line)"></i> Observed step</span>
    </div>
    <div class="timeline">${tl}</div>

    <h2 class="sec">Evidence</h2>
    <div class="ev-list">${evItems}</div>

    <h2 class="sec">Facts vs findings</h2>
    <div class="fvf">
      <div class="fcol observed"><h4>Observed evidence</h4><div class="hint">Directly captured facts</div><ul>${li(i.facts.observed)}</ul></div>
      <div class="fcol derived"><h4>Derived findings</h4><div class="hint">Conclusions from multiple items</div><ul>${li(i.facts.derived)}</ul></div>
      <div class="fcol unknown"><h4>Unknown</h4><div class="hint">Evidence cannot establish</div><ul>${li(i.facts.unknown)}</ul></div>
    </div>

    <h2 class="sec">Contributing factors</h2>
    <div class="factors">${factors}</div>

    <h2 class="sec">Findings</h2>
    <div class="findings">${findings}</div>`;
}

function viewEvidence() {
  const rows = DATA.investigations.flatMap((i) =>
    i.evidence.map((e) => ({ ...e, inv: i.id, sys: i.system }))
  ).map((e) => {
    const meta = Object.entries(e.meta).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(" · ");
    return `<div class="ev-item">
      <div class="eid">${e.id}</div>
      <div><div class="etitle">${esc(e.title)}</div><div class="emeta"><span>${esc(e.inv)}</span><span>${esc(e.sys)}</span><span>${meta}</span></div></div>
      <div class="etype">${esc(e.type)}</div>
    </div>`;
  }).join("");
  return `
    <div class="eyebrow">Traceable facts</div>
    <h1 class="page" style="font-size:30px">Evidence</h1>
    <p class="lead" style="font-size:15px">Directly captured facts. Every conclusion in an investigation traces back to items here.</p>
    <h2 class="sec" style="display:flex;justify-content:space-between;align-items:center"><span>Observed evidence across investigations</span><span class="demo-tag">Demo data</span></h2>
    <div class="ev-list">${rows}</div>`;
}

function viewSystems() {
  const rows = DATA.systems.map((s) => `
    <tr>
      <td><div class="cell-title">${esc(s.name)}</div><div class="cell-sub">${esc(s.app)}</div></td>
      <td>${esc(s.model)}</td>
      <td class="muted" style="font-size:12.5px">${s.tools.map(esc).join(", ")}</td>
      <td class="muted" style="font-size:12.5px;white-space:nowrap">${esc(s.last)}</td>
      <td>${s.inv.map((id) => `<span class="evref" data-open="${id}">${id}</span>`).join(" ")}</td>
    </tr>`).join("");
  return `
    <div class="eyebrow">Observed in evidence</div>
    <h1 class="page" style="font-size:30px">AI Systems</h1>
    <p class="lead" style="font-size:15px">Agents and models observed while investigating failures — scoped to forensics, not governance.</p>
    <h2 class="sec" style="display:flex;justify-content:space-between;align-items:center"><span>Systems inventory</span><span class="demo-tag">Demo data</span></h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Agent</th><th>Model / provider</th><th>Tools used</th><th>Last activity</th><th>Investigations</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

function viewFindings() {
  const rows = DATA.investigations.flatMap((i) =>
    i.findings.map((f, n) => ({ inv: i.id, title: i.title, n: n + 1, ...f }))
  ).map((f) => {
    const refs = f.ev.map((r) => `<span class="evref" data-ev="${r}" data-open="${f.inv}">${r}</span>`).join(" ");
    return `<div class="finding">
      <div class="fnum">${f.inv} · Finding ${String(f.n).padStart(2, "0")}</div>
      <div class="ftext">${esc(f.text)}</div>
      <div class="fev">Evidence: ${refs} <span class="muted">— from “${esc(f.title)}”</span></div>
    </div>`;
  }).join("");
  return `
    <div class="eyebrow">Derived conclusions</div>
    <h1 class="page" style="font-size:30px">Findings</h1>
    <p class="lead" style="font-size:15px">Conclusions derived from evidence. Each finding links back to the records that support it.</p>
    <h2 class="sec" style="display:flex;justify-content:space-between;align-items:center"><span>All findings</span><span class="demo-tag">Demo data</span></h2>
    <div class="findings">${rows}</div>`;
}

function viewSystem() {
  return `
    <div class="eyebrow">Architecture &amp; integrations</div>
    <h1 class="page" style="font-size:30px">System / Integrations</h1>
    <p class="lead" style="font-size:15px">The subsystems that supply evidence to the forensic engine. Implementation detail — not the product experience.</p>

    <h2 class="sec">Local Evidence Capture</h2>
    <div class="card">
      <h3>Internal evidence subsystem</h3>
      <p>Captures relevant AI activity and preserves it for investigation. Not the product identity — part of the architecture that feeds the engine.</p>
      <ul>
        <li>Capturing relevant AI activity</li>
        <li>Bounded local evidence storage &amp; retention</li>

    </div>

    <div class="cards">

        <div class="kv"><span class="k">Gateway proxy (OpenAI / Anthropic)</span><span class="ok">Available</span></div>
        <div class="kv"><span class="k">Universal ingest endpoint</span><span class="ok">Available</span></div>
        <div class="kv"><span class="k">MCP server wrapper</span><span class="warn">Via ingest</span></div>
        <div class="kv"><span class="k">Agent / IDE hook</span><span class="warn">Via ingest</span></div>
      </div>
      <div class="card">
        <h3>System health</h3>
        <div class="kv"><span class="k">Recorder</span><span class="ok">Operational</span></div>
        <div class="kv"><span class="k">Evidence chain integrity</span><span class="ok">Verified</span></div>
        <div class="kv"><span class="k">Redaction</span><span class="ok">Enabled</span></div>

    </div>

    <div class="cards">
      <div class="card">
        <h3>Integrations</h3>
        <p>Point one capture at your AI:</p>
        <ul>
          <li>Gateway: <code>npm run blackbox:gateway</code></li>

          <li>Any agent / MCP / CI step can POST a record</li>

      </div>
      <div class="card">

/* ---------- router ---------- */
const VIEWS = {
  overview: viewOverview,
  investigations: viewInvestigations,
  evidence: viewEvidence,
  systems: viewSystems,
  findings: viewFindings,
  system: viewSystem
};

function setActiveNav(view) {
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.view === view));
}

function render(view, arg) {
  const main = document.getElementById("main");
  if (view === "detail") {
    main.innerHTML = viewDetail(arg);
    setActiveNav("investigations");
  } else {
    main.innerHTML = (VIEWS[view] || viewOverview)();
    setActiveNav(view);
  }
  window.scrollTo({ top: 0, behavior: "auto" });
}

document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-view]");
  const open = e.target.closest("[data-open]");
  const evref = e.target.closest("[data-ev]");

  if (open && open.dataset.open) {
    e.preventDefault();
    render("detail", open.dataset.open);
    if (evref && evref.dataset.ev) requestAnimationFrame(() => flashEvidence(evref.dataset.ev));
    return;
  }
  if (nav && nav.dataset.view) {
    e.preventDefault();
    render(nav.dataset.view);
    return;
  }
  if (evref && evref.dataset.ev) {
    e.preventDefault();
    flashEvidence(evref.dataset.ev);
  }
});

function flashEvidence(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1400);
}

render("overview");
</script>
